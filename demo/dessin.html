<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dessin : pixel et vectoriel, même navigation</title>
  <script type="module" src="./dessin.ts"></script>
  <style>
    html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
    main { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; height: calc(100% - 32px); padding: 0 8px 8px; box-sizing: border-box; }
    p { margin: 0; padding: 8px; font-size: 13px; }
    sonic-paint, sonic-sketch { border: 1px solid #ccc; background: #e7e7ec; }
  </style>
</head>
<body>
  <p>Molette : zoom · Espace / bouton du milieu : déplacer · deux doigts : déplacer, zoomer, tourner · + − 0 R</p>
  <main>
    <sonic-paint id="pixel" navigable width="4000" height="4000" background="transparent" size="64" blend="multiply" color="#e43b44" out-data-provider="pixelState"></sonic-paint>
    <sonic-sketch id="vecto" width="800" height="600" color="#124e89" size="12" out-data-provider="vectoState"></sonic-sketch>
  </main>
</body>
</html>
